name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 設定 MSVC 開發者環境
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # 2. 安裝 Qt 5.15
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      # 3. 自動判斷 CMakeLists.txt 路徑並配置編譯
      - name: Configure and Build
        shell: powershell
        run: |
          $sourceDir = "."
          if (Test-Path "src\CMakeLists.txt") {
              $sourceDir = "src"
          } elseif (-not (Test-Path "CMakeLists.txt")) {
              Write-Error "Could not find CMakeLists.txt in root or src directory."
              exit 1
          }
          
          # 執行 CMake 配置與編譯
          cmake -S $sourceDir -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build build --config Release

      # 4. 打包可執行檔與 Qt 依賴 DLL
      - name: Package Executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_pkg
          $exePath = Get-ChildItem -Path build -Filter "speedcrunch.exe" -Recurse | Select-Object -First 1
          if ($exePath) {
              Copy-Item $exePath.FullName -Destination release_pkg\
          } else {
              Write-Error "Could not find speedcrunch.exe in build directory."
              exit 1
          }
          windeployqt release_pkg\speedcrunch.exe
          Compress-Archive -Path release_pkg\* -DestinationPath SpeedCrunch-Windows.zip

      # 5. 上傳供 Actions Artifact 下載
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCrunch-Windows-MSVC
          path: SpeedCrunch-Windows.zip

      # 6. Tag 建立時自動建立/更新 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpeedCrunch-Windows.zip
          generate_release_notes: true
