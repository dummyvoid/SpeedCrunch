name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 設定 MSVC 開發者環境
      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      # 2. 安裝 Qt 5.15
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      # 3. 配置與編譯 (使用雙引號包覆 POLICY 參數並指定根目錄)
      - name: Configure and Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build build --config Release

      # 4. 打包可執行檔與 Qt DLL 檔
      - name: Package Executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_pkg
          $exePath = Get-ChildItem -Path build -Filter "speedcrunch.exe" -Recurse | Select-Object -First 1
          if ($exePath) {
              Copy-Item $exePath.FullName -Destination release_pkg\
          } else {
              Write-Error "Could not find speedcrunch.exe in build directory."
              exit 1
          }
          windeployqt release_pkg\speedcrunch.exe
          Compress-Archive -Path release_pkg\* -DestinationPath SpeedCrunch-Windows.zip

      # 5. 上傳為 Artifact 供下載
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: SpeedCrunch-Windows-MSVC
          path: SpeedCrunch-Windows.zip
